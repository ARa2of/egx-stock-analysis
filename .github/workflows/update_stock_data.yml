# .github/workflows/update_stock_data.yml
name: Update Stock Analysis - Daily at 5 PM Egypt Time

on:
  schedule:
    # Runs at 5 PM Egypt Time (3 PM UTC) every day
    # Egypt is UTC+2, so 5 PM Egypt = 3 PM UTC
    - cron: '0 15 * * *'
  
  # Allow manual trigger from GitHub
  workflow_dispatch:

jobs:
  update-analysis:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        pip install pandas numpy yfinance openpyxl tradingview-ta
    
    - name: Run stock analysis
      run: |
        python egx_stock_analysis_3.py
    
    - name: Commit and push updated Excel file
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add Stock_Analysis_Output.xlsx
        git diff --staged --quiet || git commit -m "Daily update: $(date +'%Y-%m-%d %H:%M')"
        git push
