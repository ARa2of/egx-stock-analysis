# .github/workflows/update_stock_data.yml
name: Update Stock Analysis - Daily at 5 PM Egypt Time

on:
  schedule:
    - cron: '0 15 * * *'  # 5 PM Egypt Time (3 PM UTC)
  workflow_dispatch:      # Keep manual trigger

jobs:
  update-analysis:
    runs-on: ubuntu-latest

    steps:
    # 1. Update checkout action from v3 to v4
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2. Update setup-python action from v4 to v5
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        pip install pandas numpy yfinance openpyxl tradingview-ta

    - name: Run stock analysis
      run: |
        python egx_stock_analysis.py

    - name: Commit and push updated Excel file
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add Stock_Analysis_Output.xlsx
        git diff --staged --quiet || git commit -m "Daily update: $(date +'%Y-%m-%d %H:%M')"
        git push
